[project]
name = "pyclustifyr"
version = "0.1.0"
description = "Python port of clustifyR for reference-based cell-type annotation of single-cell RNA-seq data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Kaufman", email = "MLKaufman@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = [
    "clustifyr",
    "single-cell",
    "rna-seq",
    "cell-type-annotation",
    "bioinformatics",
    "anndata",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.12.19",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/MLKaufman/pyclustifyr"
Documentation = "https://github.com/MLKaufman/pyclustifyr/blob/main/docs/api.md"
Repository = "https://github.com/MLKaufman/pyclustifyr"
Issues = "https://github.com/MLKaufman/pyclustifyr/issues"
Changelog = "https://github.com/MLKaufman/pyclustifyr/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
